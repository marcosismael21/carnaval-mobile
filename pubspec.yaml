name: room_finder_flutter
description: A new Flutter project.

version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Base
  nb_utils: ^7.0.4
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0

  # STATE MANAGEMENT
  mobx: ^2.3.3+2
  flutter_mobx: ^2.2.1+1
  flutter_launcher_icons: ^0.14.3
  google_maps_flutter: ^2.12.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.22.0
  permission_handler: ^12.0.0+1
  geolocator: ^14.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

dependency_overrides:
  intl: ^0.19.0
  http: ^1.2.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  mobx_codegen: ^2.6.1
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.3
  #flutter packages pub run build_runner build --delete-conflicting-outputs

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/roomFinding/marca_dark.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "images/roomFinding/marca_dark.png"

flutter:

  uses-material-design: true

  assets:
    - images/roomFinding/
